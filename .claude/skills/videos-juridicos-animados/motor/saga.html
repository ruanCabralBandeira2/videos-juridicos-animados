<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saga</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&display=block" rel="stylesheet" onerror="this.remove()">
<style>
@font-face { font-family: 'Oswald Local'; src: url('fonts/Oswald.ttf'); font-weight: 200 700; }
:root { --u: 7.2px; --cond: 'Oswald', 'Oswald Local', 'Arial Narrow', sans-serif; --verm: #e0453a; --amar: #f2b134; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #000; overflow: hidden; }
#palco { position: relative; overflow: hidden; background: #000; }
#palco > * { position: absolute; inset: 0; }
svg#cena { width: 100%; height: 100%; display: block; }
svg text { font-family: var(--cond); }
#flash { background: #fff; opacity: 0; }
#legenda { top: 64.5%; bottom: auto; padding: 0 6%; text-align: center; font-family: var(--cond); font-weight: 600; text-transform: uppercase;
  color: #fff; font-size: calc(var(--u)*6.1); line-height: 1.05; letter-spacing: .01em;
  text-shadow: 0 calc(var(--u)*.35) 0 rgba(0,0,0,.35), 0 0 calc(var(--u)*2.2) rgba(0,0,0,.55); }
#legenda .verm { color: var(--verm); }
#legenda .amar { color: var(--amar); }
#legenda .real { color: var(--amar); }
#final { background: #0f1013; opacity: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 8%; font-family: var(--cond); color: #fff; text-transform: uppercase; }
#final .parte { font-weight: 700; font-size: calc(var(--u)*14); line-height: 1; }
#final .perg { color: var(--verm); font-weight: 600; font-size: calc(var(--u)*4.4); margin-top: calc(var(--u)*1.2); }
#final .cta { font-weight: 500; font-size: calc(var(--u)*2.3); letter-spacing: .08em; margin-top: calc(var(--u)*2.2); opacity: .9; }
#final .serie { position: absolute; bottom: 9%; left: 0; right: 0; font-size: calc(var(--u)*1.8); letter-spacing: .35em; opacity: .45; }
#final .fonte { position: absolute; bottom: 4.5%; left: 8%; right: 8%; font-size: calc(var(--u)*1.55); text-transform: none; letter-spacing: .02em; opacity: .4; font-weight: 400; line-height: 1.4; }
</style>
</head>
<body>
<div id="palco">
  <svg id="cena" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice"></svg>
  <div id="flash"></div>
  <div id="legenda"></div>
  <div id="final"><div class="parte"></div><div class="perg"></div><div class="cta"></div><div class="serie"></div><div class="fonte"></div></div>
</div>
<script type="module" src="./saga.js"></script>
</body>
</html>
